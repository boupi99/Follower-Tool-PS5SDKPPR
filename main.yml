name: Build PS5 Payload
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential clang lld make cmake python3 git

    - name: Clone SDK
      run: git clone https://github.com/ps5-payload-dev/sdk.git ps5-payload-sdk

    - name: Build Toolchain
      run: |
        cd ps5-payload-sdk
        make -j$(nproc)
        cd ..

    - name: Build Payload
      run: |
        export PS5_PAYLOAD_SDK=$(pwd)/ps5-payload-sdk
        $PS5_PAYLOAD_SDK/target/bin/x86_64-scei-ps5-clang --target=x86_64-scei-ps5 -isystem $PS5_PAYLOAD_SDK/target/include -o ppr_sniffer.elf ppr_sniffer.c

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ppr_sniffer
        path: ppr_sniffer.elf
