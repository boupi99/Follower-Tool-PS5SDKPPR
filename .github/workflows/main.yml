name: Build PS5 Payload
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y clang-18 lld-18 make python3 git
        
    - name: Clone SDK
      run: git clone https://github.com/ps5-payload-dev/sdk.git ps5-payload-sdk
      
    - name: Build Payload
      run: |
        export PS5_PAYLOAD_SDK=$PWD/ps5-payload-sdk
        clang-18 --target=x86_64-scei-ps5 -isystem $PS5_PAYLOAD_SDK/target/include -o ppr_sniffer.elf ppr_sniffer.c
        
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ppr_sniffer
        path: ppr_sniffer.elf
